apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibrix-redis-master
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: aibrix-redis
    app: aibrix-redis-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aibrix-redis-master
  template:
    metadata:
      labels:
        app: aibrix-redis-master
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: redis
          containerPort: 6379
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aibrix-redis-master
  namespace: aibrix-system
  labels:
    app.kubernetes.io/name: aibrix-redis
    app: aibrix-redis-master
spec:
  selector:
    app: aibrix-redis-master
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
